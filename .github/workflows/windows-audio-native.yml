name: Build Windows audio native dependency

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.4
          architecture: x64
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build locked native dependencies
        shell: pwsh
        run: npm.cmd ci --include=optional --legacy-peer-deps --foreground-scripts

      - name: Build Windows ASIO backend
        shell: pwsh
        run: ./scripts/build-windows-asio.ps1

      - name: Verify native dependencies
        shell: pwsh
        run: |
          npm.cmd run check:audio-native
          npm.cmd run check:opus-native
          node.exe scripts/asio-native-check.ts

      - name: Prepare minimal overlay
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $PWD "target\windows-audio-native"
          $moduleRoot = Join-Path $artifactRoot "node_modules"
          New-Item -ItemType Directory -Force -Path $moduleRoot | Out-Null

          $packages = @("@discordjs/opus", "naudiodon2", "bindings", "file-uri-to-path")
          $versions = [ordered]@{}
          foreach ($package in $packages) {
            $source = Join-Path $PWD "node_modules\$package"
            if (-not (Test-Path -LiteralPath $source -PathType Container)) {
              throw "Required native runtime package is missing: $package"
            }
            $metadata = Get-Content -LiteralPath (Join-Path $source "package.json") -Raw | ConvertFrom-Json
            $versions[$package] = $metadata.version
          }

          $opusBinaries = @(Get-ChildItem -LiteralPath "node_modules\@discordjs\opus\prebuild" -Filter "opus.node" -File -Recurse)
          if ($opusBinaries.Count -ne 1) {
            throw "Expected exactly one Windows Opus binary, found $($opusBinaries.Count)"
          }
          $opusBinary = [IO.Path]::GetRelativePath($PWD, $opusBinaries[0].FullName)

          $runtimeFiles = @(
            "node_modules\@discordjs\opus\lib\index.js",
            "node_modules\@discordjs\opus\package.json",
            "node_modules\@discordjs\opus\LICENSE",
            $opusBinary,
            "node_modules\naudiodon2\index.js",
            "node_modules\naudiodon2\package.json",
            "node_modules\naudiodon2\LICENSE",
            "node_modules\naudiodon2\build\Release\naudiodon.node",
            "node_modules\naudiodon2\build\Release\portaudio_x64.dll",
            "node_modules\naudiodon2\portaudio\bin\portaudio_x64.dll",
            "node_modules\naudiodon2\portaudio\bin\portaudio_x64.lib",
            "node_modules\naudiodon2\portaudio\include\portaudio.h",
            "node_modules\naudiodon2\asio-build-info.json",
            "node_modules\bindings\bindings.js",
            "node_modules\bindings\package.json",
            "node_modules\bindings\LICENSE.md",
            "node_modules\file-uri-to-path\index.js",
            "node_modules\file-uri-to-path\package.json",
            "node_modules\file-uri-to-path\LICENSE"
          )
          foreach ($relativePath in $runtimeFiles) {
            $source = Join-Path $PWD $relativePath
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Required native runtime file is missing: $relativePath"
            }
            $destination = Join-Path $artifactRoot $relativePath
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
            Copy-Item -LiteralPath $source -Destination $destination -Force
          }

          Copy-Item -LiteralPath "target\windows-asio\source-bundle" -Destination (Join-Path $artifactRoot "native-source") -Recurse

          @"
          ParaBus Windows audio native overlay

          1. Extract this artifact into the matching ParaBus folder.
          2. Merge the included node_modules directory when prompted.
          3. Run: npm.cmd run check:audio-native
          4. Run: npm.cmd run check:opus-native
          5. In the matching source version, run: node scripts/asio-native-check.ts
          ASIO + WASAPI are built in; install the manufacturer's x64 ASIO driver separately.
          Corresponding native build sources are included under native-source.

          Build commit: $env:GITHUB_SHA
          Node: $(node.exe -p "process.version") x64
          "@ | Set-Content -LiteralPath (Join-Path $artifactRoot "README.txt") -Encoding utf8

          $files = Get-ChildItem -LiteralPath $artifactRoot -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              [ordered]@{
                path = [IO.Path]::GetRelativePath($artifactRoot, $_.FullName).Replace("\", "/")
                sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
          $nodeVersion = node.exe -p "process.version"
          [ordered]@{
            schemaVersion = 1
            commit = $env:GITHUB_SHA
            node = $nodeVersion
            platform = "win32"
            arch = "x64"
            packageLockSha256 = (Get-FileHash -LiteralPath "package-lock.json" -Algorithm SHA256).Hash.ToLowerInvariant()
            packages = $versions
            files = $files
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $artifactRoot "build-info.json") -Encoding utf8

      - name: Upload private-use artifact
        if: github.event.repository.private == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-audio-native-${{ github.sha }}
          path: target/windows-audio-native
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
